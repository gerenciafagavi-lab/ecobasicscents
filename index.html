async function sbGet(key){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/app_data?key=eq.${key}&select=value`,{
      headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`}
    });
    const d=await r.json();
    return d&&d[0]?JSON.parse(d[0].value):null;
  }catch{return null;}
}

async function sbSet(key,value){
  try{
    await fetch(`${SB_URL}/rest/v1/app_data`,{
      method:"POST",
      headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({key,value:JSON.stringify(value),updated_at:new Date().toISOString()})
    });
  }catch{}
}

async function syncDown(){
  // Load all keys from Supabase
  try{
    const r=await fetch(`${SB_URL}/rest/v1/app_data?key=in.(${SB_KEYS.map(k=>`"${k}"`).join(",")})&select=key,value`,{
      headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`}
    });
    const rows=await r.json();
    if(!Array.isArray(rows)||rows.length===0)return false;
    rows.forEach(row=>{
      try{
        const val=JSON.parse(row.value);
        localStorage.setItem("eco_"+row.key,JSON.stringify(val));
        // Update in-memory state
        if(row.key==="vis")visits=val;
        if(row.key==="inv")inv=val;
        if(row.key==="demos")demos=val;
        if(row.key==="eqs")eqStk=val;
        if(row.key==="movs")movs=val;
        if(row.key==="eqgrades")eqGrades=val;
        if(row.key==="ceq")ceq=val;
        if(row.key==="bajas")bajas=val;
        if(row.key==="nvm")nivMin=val;
        if(row.key==="vnd")vendors=val;
        if(row.key==="modelos")modelos=val;
        if(row.key==="stkseries")stkSeries=val;
        if(row.key==="cartuchos")cartuchos=val;
        if(row.key==="customclients"){
          // Apply custom clients and vendor assignments
          if(val.clients){val.clients.forEach(c=>{if(!ALL_CLIENTS.includes(c))ALL_CLIENTS.push(c);});}
          if(val.vc){Object.keys(val.vc).forEach(v=>{if(VC[v]){val.vc[v].forEach(c=>{if(!VC[v].includes(c))VC[v].push(c);});}});}
        }
      }catch{}
    });
    return true;
  }catch{return false;}
}

// AE3500 and Radiant use On/Off time directly (seconds)
const AE3500_ML_PER_SEC=0.00099537;
const AE3500_HOURS=10;
function calcAE3500(onSec,offSec){
  if(!onSec||!offSec||onSec<=0||offSec<=0)return null;
  const mlPerDay=(onSec/(onSec+offSec))*AE3500_HOURS*3600*AE3500_ML_PER_SEC;
  return Math.round(mlPerDay*31*10)/10;
}

  if(role==="admin"){

    if(pin===ADMIN_PIN){saveSess({role:"admin",name:"Admin"});return;}
    // Check admin vendors
    const adminVnd=vendors.find(x=>x.pin===pin&&x.active!==false&&x.role==="admin");
    if(adminVnd){saveSess({role:"admin",name:adminVnd.name});return;}
    document.getElementById("lerr").textContent="PIN incorrecto";
  } else {
    const vid=document.getElementById("lvnd").value;
    const v=vendors.find(x=>x.id===vid&&x.pin===pin&&x.active!==false);

    }
  }

function regVisit(){
  const esProblem=!!(window._prob);
  // If problem visit, esencia and ML are optional
  if(!selC){showToast("Selecciona un cliente");return;}
  if(!esProblem&&(!selS||!mlV||parseInt(mlV)<=0)){showToast("Completa esencia y ML consumidos");return;}
  if(esProblem&&selS&&mlV&&parseInt(mlV)<=0){showToast("Si ingresas esencia, los ML deben ser mayor a 0");return;}
  const ml=parseInt(mlV)||0;
  if(selS&&ml>0&&(inv[selS]||0)<ml){showToast("Stock insuficiente");return;}
  const v={id:uid(),fecha:new Date().toISOString(),vnd:sess.name,cliente:selC,modelo:selEq?.modelo||"",serie:selEq?.serie||"",area:selEq?.area||"",esencia:selS||"",ml,notas:notV,prob:!!(window._prob)};
  visits=[v,...visits];
  if(selS&&ml>0)inv={...inv,[selS]:(inv[selS]||0)-ml};
  // Auto-deduct cartucho for FMATIC Blanco/Negro
  const eqModelo=selEq?.modelo||"";
  if((eqModelo==="FMATIC Blanco"||eqModelo==="FMATIC Negro")&&selS&&selS.startsWith("Cartucho")){

    } else {

  }
  sv("vis",visits);sv("inv",inv);
  selC="";selEq=null;selS="";mlV="";notV="";window._prob=false;
  showToast("Visita registrada");
}
function delVisit(id){
  const v=visits.find(x=>x.id===id);
  if(v)inv={...inv,[v.esencia]:(inv[v.esencia]||0)+v.ml};

function getNextSerie(modelo){
  const prefix="ES"+modelo.replace(/^AE/,"")+"-";
  const allSeries=[];
  // From EQUIPOS_DB
  Object.values(EQUIPOS_DB).forEach(eqs=>eqs.forEach(eq=>{if(eq.modelo===modelo)allSeries.push(eq.serie)}));
  // From custom ceq
  Object.values(ceq).forEach(eqs=>eqs.forEach(eq=>{if(eq.modelo===modelo&&!eq._del)allSeries.push(eq.serie)}));
  // From demos (active and retired)
  demos.forEach(d=>{if(d.modelo===modelo&&d.serie)allSeries.push(d.serie);});
  // From movimientos
  movs.forEach(m=>{if(m.modelo===modelo&&m.serie)allSeries.push(m.serie);});
  // Extract numbers
  const nums=allSeries.map(s=>{const m=s.match(/(\d+)$/);return m?parseInt(m[1]):0;}).filter(n=>n>0);
  const nextNum=nums.length>0?Math.max(...nums)+1:1;
  return prefix+String(nextNum).padStart(3,"0");
}

  const next=getNextSerie(m);
  const el=document.getElementById("ceq_s");

function saveEditCEq(){
  const newSerie=document.getElementById("ece_s").value.trim();
  const newArea=document.getElementById("ece_a").value.trim();
  const newAroma=document.getElementById("ece_ar").value;
  const newModelo=document.getElementById("ece_m").value;
  if(!newSerie){showToast("La serie es requerida");return;}
  const c=modal.c;
  const oldSerie=modal.eq.serie;
  const oldId=modal.eq.id;
  // Check duplicate serie (ignore self)
  const allEqsFlat=[...Object.values(EQUIPOS_DB).flat(),...Object.values(ceq).flat().filter(e=>!e._del&&e.serie!==oldSerie)];
  if(allEqsFlat.find(e=>e.serie===newSerie&&e.serie!==oldSerie)){showToast("Ya existe un equipo con esa serie");return;}
  // Update in ceq
  const existing=ceq[c]||[];
  const inCustom=existing.find(e=>e.id===oldId||e.serie===oldSerie);
  if(inCustom){
    ceq={...ceq,[c]:existing.map(e=>(e.id===oldId||e.serie===oldSerie)?{...e,modelo:newModelo,serie:newSerie,area:newArea,aroma:newAroma}:e)};
  } else {
    // It's a base equipo - create custom override and mark base as deleted
    const baseEq=modal.eq;
    ceq={...ceq,[c]:[...existing,{...baseEq,modelo:newModelo,serie:newSerie,area:newArea,aroma:newAroma},{id:uid(),serie:oldSerie,_del:true}]};
  }
  // Update eqGrades if serie changed
  if(oldSerie!==newSerie&&eqGrades[oldSerie]){
    eqGrades={...eqGrades,[newSerie]:{...eqGrades[oldSerie]}};
    delete eqGrades[oldSerie];
    sv("eqgrades",eqGrades);
  }
  sv("ceq",ceq);modal=null;showToast("Equipo actualizado");
}
function delCEq(c,id,serie){
  // Remove custom eq by id
  const updated=(ceq[c]||[]).filter(e=>e.id!==id);
  // If it was a base eq (from EQUIPOS_DB), mark it deleted
  const isBase=(EQUIPOS_DB[c]||[]).find(e=>e.serie===serie);
  if(isBase){updated.push({id:uid(),serie,_del:true});}
  ceq={...ceq,[c]:updated};
  sv("ceq",ceq);render();
}

  const notas=document.getElementById("ca_n").value.trim();
  if(!eqId||!newAroma){showToast("Selecciona equipo y aroma");return;}
  // Find the equipo - could be in ceq or EQUIPOS_DB
  const cliente=modal.c;
  const allEqs=getClientEqs(cliente).filter(e=>!e._del);

    ceq={...ceq,[cliente]:existing.map(e=>(e.id===eq.id||e.serie===eq.serie)?{...e,aroma:newAroma}:e)};

    // Create custom override for base equipo
    ceq={...ceq,[cliente]:[...existing,{...eq,id:eq.id||uid(),aroma:newAroma}]};

    const isBase=(EQUIPOS_DB[cliente]||[]).find(e=>e.serie===eq.serie);
    if(isBase){
      // Already added the override above, now remove the base duplicate
      // The getClientEqs function merges custom + base, so we need to prevent base from showing
      ceq={...ceq,[cliente]:ceq[cliente].filter(e=>!e._del)};

function getGradeDisplay(serie){
  const gi=eqGrades[serie];
  if(!gi)return"";
  if(gi.tipo==="onoff")return' <span style="font-size:10px;color:#3456a0;font-weight:600">On:'+gi.onSec+'s Off:'+gi.offSec+'s</span>';
  if(gi.tipo==="bat101"){
    if(gi.modo==="motion")return' <span style="font-size:10px;color:#3456a0;font-weight:600"><i class="ti ti-radar" style="font-size:10px"></i> Motion</span>';
    if(gi.grade){const alerta=gi.gradeCotizado&&gi.grade>gi.gradeCotizado;return' <span style="font-size:10px;font-weight:700;color:'+(alerta?'var(--D)':'#3456a0')+'">N'+gi.grade+(alerta?' ⚠':'')+'</span>';}
  }
  if(gi.grade){
    const alerta=gi.gradeCotizado&&gi.grade>gi.gradeCotizado;
    return' <span style="font-size:10px;font-weight:700;color:'+(alerta?'var(--D)':'#3456a0')+'">G'+gi.grade+(alerta?' ⚠':'')+'</span>';
  }
  return"";
}

function openAddCliente(){modal={t:"addCliente"};render()}
function saveCliente(){
  const nombre=document.getElementById("cl_n").value.trim().toUpperCase();
  const vendedor=document.getElementById("cl_v").value;
  const zona=document.getElementById("cl_z").value.trim();
  if(!nombre){showToast("Ingresa el nombre del cliente");return;}
  if(ALL_CLIENTS.includes(nombre)){showToast("Ese cliente ya existe");return;}
  ALL_CLIENTS.push(nombre);
  // Assign to vendor
  if(vendedor&&VC[vendedor]){VC[vendedor].push(nombre);}
  // Save only custom additions
  const customC=ld("customclients",{clients:[],vc:{}});
  if(!customC.clients.includes(nombre))customC.clients.push(nombre);
  if(vendedor){if(!customC.vc[vendedor])customC.vc[vendedor]=[];if(!customC.vc[vendedor].includes(nombre))customC.vc[vendedor].push(nombre);}
  sv("customclients",customC);
  modal=null;showToast("Cliente "+nombre+" agregado");
}

function updCartucho(nombre,val){
  const n=parseInt(val);
  if(isNaN(n)||n<0)return;
  cartuchos={...cartuchos,[nombre]:n};
  sv("cartuchos",cartuchos);render();
}
function addCartucho(){
  const nombre=document.getElementById("cart_n")?.value?.trim();
  if(!nombre){showToast("Ingresa el nombre del cartucho");return;}
  const nombreFull="Cartucho "+nombre.toUpperCase();
  if(cartuchos.hasOwnProperty(nombreFull)){showToast("Ya existe ese cartucho");return;}
  cartuchos={...cartuchos,[nombreFull]:0};
  sv("cartuchos",cartuchos);modal=null;showToast("Cartucho agregado");
}
function delCartucho(nombre){
  if(cartuchos[nombre]>0){showToast("Tiene "+cartuchos[nombre]+" unidades. Primero ponlo en 0.");return;}
  const nc={...cartuchos};delete nc[nombre];
  cartuchos=nc;sv("cartuchos",cartuchos);render();
}

function getClientesVencidos(){
  // Clients with no visit in 30+ days
  const hoy=new Date();
  const myClients=sess?.role==="admin"?ALL_CLIENTS:(VC[sess?.name]||[]);
  return myClients.filter(c=>{
    const lastVisit=visits.filter(v=>v.cliente===c).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0];
    if(!lastVisit)return true; // Never visited
    const dias=Math.floor((hoy-new Date(lastVisit.fecha))/(864e5));
    return dias>=30;
  });
}

function exportCSV(data, filename){
  if(!data.length){showToast("Sin datos para exportar");return;}
  const rows=data.map(r=>Object.values(r).map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(","));
  const headers='"'+Object.keys(data[0]).join('","')+'"';
  const csv="﻿"+[headers,...rows].join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("CSV descargado");
}

function getReportData(){
  const rFrom=window._rFrom||"";
  const rTo=window._rTo||"";
  const rType=window._rType||"visitas";
  let data=rType==="reclamos"?visits.filter(v=>v.prob):visits;
  if(rFrom)data=data.filter(v=>v.fecha>=rFrom);
  if(rTo)data=data.filter(v=>v.fecha<=rTo+"T23:59:59");
  return{data,rType};
}
function doExportCSV(){
  const {data,rType}=getReportData();
  if(!data.length){alert("No hay datos para exportar");return;}
  const rows=data.map(v=>({
    Fecha:fmt(v.fecha),Vendedor:v.vnd||"",Cliente:v.cliente||"",
    Modelo:v.modelo||"",Serie:v.serie||"",Esencia:v.esencia||"",
    ML:v.ml||0,Problema:v.prob?"Si":"No",Notas:v.notas||""
  }));
  exportCSV(rows,(rType==="reclamos"?"reclamos":"visitas")+"_reporte.csv");
}
function doExportPDF(){
  const {data,rType}=getReportData();
  if(!data.length){alert("No hay datos para exportar");return;}
  const headers=["Fecha","Vendedor","Cliente","Modelo","Serie","Esencia","ML","Problema","Notas"];
  const rows=data.map(v=>[fmt(v.fecha),v.vnd||"",v.cliente||"",v.modelo||"",v.serie||"",v.esencia||"",v.ml||0,v.prob?"Si":"No",v.notas||""]);
  exportPDF(rType==="reclamos"?"Reporte de Reclamos":"Reporte de Visitas",headers,rows);
}

function exportPDF(title, headers, rows){
  if(!rows.length){showToast("Sin datos para exportar");return;}
  modal={t:"reportView",title,headers,rows,tipo:"pdf"};render();
}

// Initial sync from Supabase on page load
render();
syncDown().then(ok=>{
  const cc=ld("customclients",{clients:[],vc:{}});
  if(cc.clients){cc.clients.forEach(c=>{if(!ALL_CLIENTS.includes(c))ALL_CLIENTS.push(c);});}
  if(cc.vc){Object.keys(cc.vc).forEach(v=>{if(!VC[v])VC[v]=[];cc.vc[v].forEach(c=>{if(!VC[v].includes(c))VC[v].push(c);});});}
  render();
});

// Auto-sync every 2 minutes when logged in
setInterval(()=>{
  if(!sess)return;
  syncDown().then(ok=>{
    if(ok){
      const cc=ld("customclients",{clients:[],vc:{}});
      if(cc.clients){cc.clients.forEach(c=>{if(!ALL_CLIENTS.includes(c))ALL_CLIENTS.push(c);});}
      if(cc.vc){Object.keys(cc.vc).forEach(v=>{if(!VC[v])VC[v]=[];cc.vc[v].forEach(c=>{if(!VC[v].includes(c))VC[v].push(c);});});}
      render();
    }
  });
}, 2*60*1000);
</script>
