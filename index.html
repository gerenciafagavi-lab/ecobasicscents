const SB_KEYS=["vis","inv","demos","eqs","movs","eqgrades","ceq","bajas","nvm","vnd","modelos","stkseries","cartuchos","customclients","sols","rejillas","baterias"];
async function sbSet(k,v){try{await fetch(SB_URL+"/rest/v1/app_data",{method:"POST",mode:"cors",credentials:"omit",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates","X-Client-Info":"ecobasicscents/1.0"},body:JSON.stringify({key:k,value:JSON.stringify(v),updated_at:new Date().toISOString()})});}catch{}}
async function syncDown(){
  try{
    const url=SB_URL+"/rest/v1/app_data?key=in.("+SB_KEYS.map(k=>'"'+k+'"').join(",")+")&select=key,value";
    const r=await fetch(url,{mode:"cors",credentials:"omit",cache:"no-store",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Accept":"application/json","X-Client-Info":"ecobasicscents/1.0"}});
    if(!r.ok){console.error("Supabase HTTP error:",r.status,r.statusText);return false;}
    const rows=await r.json();
    if(!Array.isArray(rows)){console.error("Supabase bad response:",rows);return false;}
    if(!rows.length)return true;
    rows.forEach(row=>{
      try{
        const val=JSON.parse(row.value);
        localStorage.setItem("eco_"+row.key,JSON.stringify(val));
        if(row.key==="vis")visits=val;
        if(row.key==="inv"){const localInv=ld("inv",{});const merged={...val};Object.keys(localInv).forEach(k=>{if((localInv[k]||0)>(merged[k]||0))merged[k]=localInv[k];});inv=merged;localStorage.setItem("eco_inv",JSON.stringify(merged));}
        if(row.key==="demos")demos=val;
        if(row.key==="eqs")eqStk=val;
        if(row.key==="movs")movs=val;
        if(row.key==="eqgrades")eqGrades=val;
        if(row.key==="ceq")ceq=val;
        if(row.key==="bajas")bajas=val;
        if(row.key==="nvm")nivMin=val;
        if(row.key==="vnd")vendors=val;
        if(row.key==="modelos")modelos=val;
        if(row.key==="cartuchos")cartuchos=val;
        if(row.key==="rejillas")rejillas=val;
        if(row.key==="baterias")baterias=val;
        if(row.key==="sols")solicitudes=val;
        if(row.key==="customclients"){
          if(val.clients)val.clients.forEach(c=>{if(!ALL_CLIENTS.includes(c))ALL_CLIENTS.push(c);});
          if(val.vc)Object.keys(val.vc).forEach(v=>{if(!VC[v])VC[v]=[];val.vc[v].forEach(c=>{if(!VC[v].includes(c))VC[v].push(c);});});
          if(val.pais){if(!window._clientPais)window._clientPais={};Object.assign(window._clientPais,val.pais);}
        }
      }catch{}
    });
    return true;
  }catch(e){console.error("syncDown exception:",e.name,e.message);return false;}
}

function getClientEqs(c){
  if(!c)return[];
  const custom=ceq[c]||[];
  const replaceFull=new Set(["CEPA AEROPUERTO","PALMETTO RAMBLAS SANTA ANA"]);
  if(replaceFull.has(c))return custom;
  const base=EQUIPOS_DB[c]||[];
  const extra=base.filter(b=>!custom.find(x=>x.serie===b.serie&&!x._del));
  return[...custom,...extra];
}

function getGradeDisplay(serie){
  const gi=eqGrades[serie];if(!gi)return"";
  if(gi.tipo==="onoff")return" <span style='font-size:10px;color:#3456a0;font-weight:600'>On:"+gi.onSec+"s/Off:"+gi.offSec+"s</span>";
  if(gi.grade){const al=gi.gradeCotizado&&gi.grade>gi.gradeCotizado;return" <span style='font-size:10px;font-weight:700;color:"+(al?"var(--D)":"#3456a0")+"'>G"+gi.grade+(al?" \u26a0":"")+"</span>";}
  return"";
}
function getNextSerie(modelo){
  const allS=[];
  Object.values(EQUIPOS_DB).forEach(eqs=>eqs.forEach(eq=>{if(eq.modelo===modelo)allS.push(eq.serie);}));
  Object.values(ceq).forEach(eqs=>eqs.forEach(eq=>{if(eq.modelo===modelo&&!eq._del)allS.push(eq.serie);}));
  demos.forEach(d=>{if(d.modelo===modelo&&d.serie)allS.push(d.serie);});
  const nums=allS.map(s=>{const m=s.match(/(\d+)$/);return m?parseInt(m[1]):0;}).filter(n=>n>0);
  const next=nums.length>0?Math.max(...nums)+1:1;
  const prefix="ES"+modelo.replace(/^AE/,"").replace(/\s.*/,"");
  return prefix+"-"+String(next).padStart(3,"0");
}

// ── AUTH ──
function doLogin(){
  const pin=document.getElementById("lpin").value.trim();
  const role=document.getElementById("lrole").value;
  if(role==="admin"){
    if(pin===ADMIN_PIN){saveSess({role:"admin",name:"Admin"});return;}
    const av=vendors.find(x=>x.pin===pin&&x.active!==false&&x.role==="admin");
    if(av){saveSess({role:"admin",name:av.name});return;}
    document.getElementById("lerr").textContent="PIN incorrecto";return;
  }
  if(role==="atencion"){
    const ac=vendors.find(x=>x.pin===pin&&x.active!==false&&x.role==="atencion");
    if(ac){saveSess({role:"atencion",name:ac.name});return;}
    document.getElementById("lerr").textContent="PIN incorrecto";return;
  }
  const vnd=vendors.find(x=>x.pin===pin&&x.active!==false&&x.role==="vendor");
  if(vnd){saveSess({role:"vendor",name:vnd.name});return;}
  document.getElementById("lerr").textContent="PIN incorrecto";
}
function saveSess(s){
  sess=s;sv("sess",s);
  syncDown().then(ok=>{
    if(ok){const cc=ld("customclients",{clients:[],vc:{},pais:{}});if(cc.clients)cc.clients.forEach(c=>{if(!ALL_CLIENTS.includes(c))ALL_CLIENTS.push(c);});if(cc.vc)Object.keys(cc.vc).forEach(v=>{if(!VC[v])VC[v]=[];cc.vc[v].forEach(c=>{if(!VC[v].includes(c))VC[v].push(c);});});if(cc.pais)Object.assign(window._clientPais,cc.pais);}
    // Si hay pocos clientes en Supabase, subir datos base automáticamente
    if(s.role==="admin"){
      const ccNow=ld("customclients",{clients:[],vc:{},pais:{}});
      const totalC=(ccNow.clients||[]).length;
      if(totalC<BASE_CC.clients.length){
        // Fusionar BASE con lo que hay en localStorage y subir
        const merged={clients:[...BASE_CC.clients],vc:{...BASE_CC.vc},pais:{...BASE_CC.pais}};
        if(ccNow.clients)ccNow.clients.forEach(c=>{if(!merged.clients.includes(c))merged.clients.push(c);});
        if(ccNow.vc)Object.keys(ccNow.vc).forEach(v=>{if(!merged.vc[v])merged.vc[v]=[];ccNow.vc[v].forEach(c=>{if(!merged.vc[v].includes(c))merged.vc[v].push(c);});});
        if(ccNow.pais)Object.assign(merged.pais,ccNow.pais);
        sv("customclients",merged);
        const ceqNow=ld("ceq",{});
        const ceqMerged={...BASE_CEQ,...ceqNow};
        sv("ceq",ceqMerged);
        BASE_CC.clients.forEach(c=>{if(!ALL_CLIENTS.includes(c))ALL_CLIENTS.push(c);});
        console.log("Base data synced to Supabase: "+merged.clients.length+" clients");
      }
    }
    render();
  });
}

function regVisitMulti(){
  const ev=window._eqVisit||{};
  const entries=Object.values(ev).filter(e=>e.done);

  if(!entries.length){showToast("Marca al menos un equipo");return;}

  const notasG=document.getElementById("notv_multi")?.value||"";
  let saved=0;
  entries.forEach(e=>{
    const v={id:uid(),fecha,vnd:sess.name,cliente:selC,modelo:e.modelo,serie:e.serie,area:e.area||"",esencia:e.esencia||"",ml:e.ml||0,mlLlegada:e.mlLlegada||null,mlSalida:e.mlSalida||null,baterias:e.baterias||null,notas:e.notas||(notasG||""),prob};
    visits=[v,...visits];
    if(e.esencia&&e.ml>0){
      if(e.tipo==="cartucho"){if((cartuchos[e.esencia]||0)>0){cartuchos={...cartuchos,[e.esencia]:(cartuchos[e.esencia]||0)-1};}}
      else if(e.tipo==="rejilla"){if((rejillas[e.esencia]||0)>0){rejillas={...rejillas,[e.esencia]:(rejillas[e.esencia]||0)-1};sv("rejillas",rejillas);}}
      else{if((inv[e.esencia]||0)>=e.ml){inv={...inv,[e.esencia]:(inv[e.esencia]||0)-e.ml};}}
    }
    if(e.baterias>0){baterias=Math.max(0,baterias-e.baterias);}
    saved++;
  });
  sv("vis",visits);sv("inv",inv);sv("cartuchos",cartuchos);sv("baterias",baterias);
  window._eqVisit={};window._probM=false;selC="";selEq=null;

}

// ── CLIENT FUNCTIONS ──
function openAddCliente(){modal={t:"addCliente"};render();}
function saveCliente(){
  const nombre=document.getElementById("cl_n").value.trim().toUpperCase();
  const vendedor=document.getElementById("cl_v").value;
  const pais=document.getElementById("cl_pais").value;
  if(!nombre){showToast("Ingresa el nombre");return;}
  if(ALL_CLIENTS.includes(nombre)){showToast("Ya existe");return;}
  ALL_CLIENTS.push(nombre);
  if(!window._clientPais)window._clientPais={};
  window._clientPais[nombre]=pais;
  if(vendedor&&VC[vendedor])VC[vendedor].push(nombre);
  const cc=ld("customclients",{clients:[],vc:{},pais:{}});
  if(!cc.clients.includes(nombre))cc.clients.push(nombre);
  if(vendedor){if(!cc.vc[vendedor])cc.vc[vendedor]=[];if(!cc.vc[vendedor].includes(nombre))cc.vc[vendedor].push(nombre);}
  if(!cc.pais)cc.pais={};cc.pais[nombre]=pais;
  sv("customclients",cc);modal=null;showToast("Cliente "+nombre+" agregado");
}
function openRenameCliente(c){modal={t:"renameCliente",c};render();}
function saveRenameCliente(){
  const oldName=modal.c;
  const newName=document.getElementById("rc_n").value.trim().toUpperCase();
  if(!newName){showToast("Ingresa el nombre");return;}
  if(newName===oldName){modal=null;render();return;}
  if(ALL_CLIENTS.includes(newName)){showToast("Ya existe");return;}
  const idx=ALL_CLIENTS.indexOf(oldName);if(idx>-1)ALL_CLIENTS[idx]=newName;
  Object.keys(VC).forEach(v=>{const i=VC[v].indexOf(oldName);if(i>-1)VC[v][i]=newName;});
  const cc=ld("customclients",{clients:[],vc:{},pais:{}});
  const ci=cc.clients.indexOf(oldName);if(ci>-1)cc.clients[ci]=newName;
  Object.keys(cc.vc||{}).forEach(v=>{const i=(cc.vc[v]||[]).indexOf(oldName);if(i>-1)cc.vc[v][i]=newName;});
  if(cc.pais&&cc.pais[oldName]){cc.pais[newName]=cc.pais[oldName];delete cc.pais[oldName];}
  if(window._clientPais&&window._clientPais[oldName]){window._clientPais[newName]=window._clientPais[oldName];delete window._clientPais[oldName];}
  sv("customclients",cc);
  if(ceq[oldName]){ceq={...ceq,[newName]:ceq[oldName]};delete ceq[oldName];sv("ceq",ceq);}
  visits=visits.map(v=>v.cliente===oldName?{...v,cliente:newName}:v);sv("vis",visits);
  modal=null;showToast("Cliente renombrado");
}
function openDeleteCliente(c){modal={t:"deleteCliente",c};render();}
function confirmDeleteCliente(){
  const c=modal.c;
  const idx=ALL_CLIENTS.indexOf(c);if(idx>-1)ALL_CLIENTS.splice(idx,1);
  Object.keys(VC).forEach(v=>{VC[v]=VC[v].filter(x=>x!==c);});
  const cc=ld("customclients",{clients:[],vc:{},pais:{}});
  cc.clients=cc.clients.filter(x=>x!==c);
  Object.keys(cc.vc||{}).forEach(v=>{cc.vc[v]=(cc.vc[v]||[]).filter(x=>x!==c);});
  if(cc.pais)delete cc.pais[c];
  if(window._clientPais)delete window._clientPais[c];
  sv("customclients",cc);
  if(ceq[c]){const nc={...ceq};delete nc[c];ceq=nc;sv("ceq",ceq);}
  modal=null;showToast("Cliente eliminado");
}

function openEditCEq(c,eqId,serie){
  const allEqs=getClientEqs(c).filter(e=>!e._del);
  const eq=allEqs.find(e=>e.id===eqId||e.serie===serie);
  if(!eq)return;
  modal={t:"editCEq",c,eq};render();
}
function saveEditCEq(){
  const c=modal.c;const eq=modal.eq;
  const newSerie=document.getElementById("ec_s").value.trim();
  const newArea=document.getElementById("ec_a").value.trim();
  const newAroma=document.getElementById("ec_aroma").value;
  if(!newSerie){showToast("Serie requerida");return;}
  const existing=ceq[c]||[];
  const inCustom=existing.find(e=>e.id===eq.id||e.serie===eq.serie);
  const updated={...eq,serie:newSerie,area:newArea,aroma:newAroma};
  if(inCustom){ceq={...ceq,[c]:existing.map(e=>(e.id===eq.id||e.serie===eq.serie)?updated:e)};}
  else{ceq={...ceq,[c]:[...existing,updated]};}
  sv("ceq",ceq);modal=null;showToast("Equipo actualizado");
}
function delCEq(c,id,serie){
  const existing=ceq[c]||[];
  const inCustom=existing.find(e=>e.id===id||e.serie===serie);
  if(inCustom){ceq={...ceq,[c]:existing.filter(e=>e.id!==id&&e.serie!==serie)};}
  else{const base=getClientEqs(c);const baseEq=base.find(e=>e.id===id||e.serie===serie);if(baseEq)ceq={...ceq,[c]:[...existing,{...baseEq,_del:true}]};}
  sv("ceq",ceq);render();showToast("Equipo eliminado");
}
function renderClientEqs(c){
  const allEq=getClientEqs(c).filter(e=>!e._del);
  if(!allEq.length)return "<div style='font-size:12px;color:var(--M);margin-bottom:8px'>Sin equipos</div>";
  if(!window._ceqRefs)window._ceqRefs={};
  return allEq.map((eq,i)=>{
    const rk="ceq_"+c.replace(/\W/g,"_")+"_"+i;
    window._ceqRefs[rk]={c,eq};
    const gs=getGradeDisplay(eq.serie);
    return "<div class='cer'>"
      +"<div style='flex:1'><span style='font-weight:700'>"+eq.serie+"</span>"
      +(eq.area?" &middot; <span style='color:var(--M)'>"+eq.area+"</span>":"")
      +(eq.aroma?" &middot; <span style='color:var(--G)'>"+eq.aroma+"</span>":"")
      +gs+"</div>"
      +"<div style='display:flex;gap:4px'>"
      +"<button style='padding:3px 8px;font-size:11px;background:#e8f0ff;color:#3456a0;border:none;border-radius:7px;cursor:pointer;font-weight:700' onclick='var r=window._ceqRefs["+JSON.stringify(rk)+"];if(r)openGradeChange(r.c,r.eq)'>&#9889;</button>"
      +"<button class='be' style='padding:3px 8px;font-size:11px' onclick='var r=window._ceqRefs["+JSON.stringify(rk)+"];if(r)openEditCEq(r.c,r.eq.id,r.eq.serie)'>&#9999;&#65039;</button>"
      +"<button class='del' onclick='var r=window._ceqRefs["+JSON.stringify(rk)+"];if(r)delCEq(r.c,r.eq.id,r.eq.serie)'>&#x2715;</button>"
      +"</div></div>";
  }).join("");
}

function saveMov(){
  const mot=document.getElementById("mv_mot").value;

  const isRet=esE&&mot==="Retiro de cliente";

    if(!chks.length){showToast("Selecciona al menos un equipo");return;}
    chks.forEach(chk=>{

      delCEq(retC,id2,s);
    });
    sv("movs",movs);sv("eqs",eqStk);modal=null;showToast("Equipos retirados");
  } else {
    const m=document.getElementById("mv_mod")?.value;

    sv("movs",movs);sv("eqs",eqStk);modal=null;showToast((esE?"Entrada":"Salida")+" registrada");

function getClientesVencidos(){
  const hoy=new Date();
  const myC=sess?.role==="admin"?ALL_CLIENTS.filter(c=>!bajasClientes.has(c)):(VC[sess?.name]||[]);
  return myC.filter(c=>{
    const lv=visits.filter(v=>v.cliente===c).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0];
    if(!lv)return true;
    return Math.floor((hoy-new Date(lv.fecha))/(864e5))>=30;
  });
}

        +"<div class='mb-t' style='color:#3456a0'>Cambiar intensidad</div>"
        +"<p class='ps' style='margin-top:-10px;margin-bottom:14px'>"+eq.modelo+" &#183; "+eq.serie+(eq.area?" &#183; "+eq.area:"")+"</p>"
        +(curGrade?"<div style='background:#e8f0ff;border-radius:10px;padding:10px;text-align:center;margin-bottom:14px'><div style='font-size:11px;color:#3456a0;font-weight:600'>GRADO ACTUAL</div><div style='font-size:28px;font-weight:700;color:#3456a0'>G"+curGrade+"</div></div>":"")
        +"<div class='fw'><label class='lbl'>Nuevo grado *</label><div style='display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px'>"+gradeBtns+"</div><input type='hidden' id='gr_grade' value='"+(curGrade||"")+"'/></div>"
        +"<div class='fw'><label class='lbl'>Notas</label><textarea class='inp' id='gr_n' placeholder='Motivo del cambio...'></textarea></div>"
        +"<div class='mb-act'><button class='btn-c' onclick='modal=null;render()'>Cancelar</button><button class='btn' style='background:#3456a0' onclick='saveGradeChange()'>Guardar</button></div></div></div>";
    }
    else if(t==="gradeOnOff"){
      const eq=modal.eq||{};const gi=eqGrades[eq.serie]||{};
      mHTML="<div class='mb-bg' onclick='if(event.target===this){modal=null;render()}'><div class='mb'>"
        +"<div class='mb-t' style='color:#3456a0'>Configurar intensidad</div>"
        +"<p class='ps' style='margin-top:-10px;margin-bottom:14px'>"+eq.modelo+" &#183; "+eq.serie+"</p>"
        +(gi.onSec?"<div style='background:#e8f0ff;border-radius:10px;padding:10px;text-align:center;margin-bottom:14px'><div style='font-size:11px;color:#3456a0;font-weight:600'>ACTUAL</div><div style='font-size:18px;font-weight:700;color:#3456a0'>On: "+gi.onSec+"s / Off: "+gi.offSec+"s</div></div>":"")
        +"<div class='fr'><div class='fw'><label class='lbl'>Segundos ON *</label><input type='number' class='inp' id='go_on' placeholder='Ej: 3' min='1' value='"+(gi.onSec||"")+"' oninput='updateAE3500Preview()'/></div>"
        +"<div class='fw'><label class='lbl'>Segundos OFF *</label><input type='number' class='inp' id='go_off' placeholder='Ej: 57' min='1' value='"+(gi.offSec||"")+"' oninput='updateAE3500Preview()'/></div></div>"
        +"<div id='go_preview' style='border-radius:10px;padding:10px;text-align:center;margin-bottom:10px;font-size:13px;background:#f0f7f4;color:var(--F)'>Ingresa los tiempos para ver estimado</div>"
        +"<div class='fw'><label class='lbl'>Notas</label><textarea class='inp' id='go_n' placeholder='Observaciones...'></textarea></div>"
        +"<div class='mb-act'><button class='btn-c' onclick='modal=null;render()'>Cancelar</button><button class='btn' style='background:#3456a0' onclick='saveGradeOnOff()'>Guardar</button></div></div></div>";
    }
    else if(t==="addBaja"){
      mHTML="<div class='mb-bg' onclick='if(event.target===this){modal=null;render()}'><div class='mb'><div class='mb-t' style='color:var(--D)'>Registrar baja</div>"
        +"<div class='fw'><label class='lbl'>Cliente *</label><input class='inp' id='bj_c' list='bj_cl' placeholder='Nombre del cliente'/><datalist id='bj_cl'>"+activeClients.map(c=>"<option>"+c+"</option>").join("")+"</datalist></div>"
        +"<div class='fw'><label class='lbl'>Motivo *</label><select class='inp' id='bj_mot'><option value=''>Selecciona...</option><option>Precio</option><option>Competencia</option><option>Problemas con equipo</option><option>Cierre de negocio</option><option>Cambio de proveedor</option><option>Sin presupuesto</option><option>Otro</option></select></div>"
        +"<div class='fw'><label class='lbl'>Notas</label><textarea class='inp' id='bj_n'></textarea></div>"
        +"<div class='mb-act'><button class='btn-c' onclick='modal=null;render()'>Cancelar</button><button class='btn' style='background:var(--D)' onclick='saveBaja()'>Registrar baja</button></div></div></div>";
    }
    else if(t==="addSolicitud"){
      const tipo=modal.tipo||"prospecto";
      const activeVnds3=vendors.filter(v=>v.active!==false&&v.role!=="admin");
      mHTML="<div class='mb-bg' onclick='if(event.target===this){modal=null;render()}'><div class='mb'><div class='mb-t'>Nueva solicitud</div>"
        +"<div style='display:flex;gap:8px;margin-bottom:14px'><button onclick='setSolTipo(\"prospecto\")' style='flex:1;padding:9px;border:1px solid var(--F);border-radius:var(--R);background:"+(tipo==="prospecto"?"var(--F)":"none")+";color:"+(tipo==="prospecto"?"#fff":"var(--F)")+";font-size:13px;font-weight:600;cursor:pointer'>Prospecto</button><button onclick='setSolTipo(\"cliente\")' style='flex:1;padding:9px;border:1px solid var(--F);border-radius:var(--R);background:"+(tipo==="cliente"?"var(--F)":"none")+";color:"+(tipo==="cliente"?"#fff":"var(--F)")+";font-size:13px;font-weight:600;cursor:pointer'>Cliente</button></div>"
        +"<div class='fw'><label class='lbl'>"+(tipo==="prospecto"?"Nombre del prospecto":"Nombre del contacto")+" *</label><input class='inp' id='sol_n' placeholder='"+(tipo==="prospecto"?"Empresa o persona":"Nombre del contacto")+"'/></div>"
        +"<div class='fw'><label class='lbl'>Vendedor *</label><select class='inp' id='sol_v'>"+activeVnds3.map(v=>"<option value='"+v.name+"'"+(v.name===sess.name?" selected":"")+">"+v.name+"</option>").join("")+"</select></div>"
        +"<div class='fw'><label class='lbl'>Notas</label><textarea class='inp' id='sol_notas' placeholder='Detalles...'></textarea></div>"
        +"<div class='mb-act'><button class='btn-c' onclick='modal=null;render()'>Cancelar</button><button class='btn' onclick='saveSolicitud()'>Enviar</button></div></div></div>";
    }
    else if(t==="convertirCliente"){
      const activeVnds4=vendors.filter(v=>v.active!==false&&v.role!=="admin");
      mHTML="<div class='mb-bg' onclick='if(event.target===this){modal=null;render()}'><div class='mb'><div class='mb-t'>Convertir a cliente</div><p class='ps'>"+modal.sol.nombre+"</p>"
        +"<div class='fw'><label class='lbl'>Nombre del cliente *</label><input class='inp' id='cc_n' value='"+modal.sol.nombre.toUpperCase()+"' style='text-transform:uppercase' oninput='this.value=this.value.toUpperCase()'/></div>"
        +"<div class='fw'><label class='lbl'>Vendedor *</label><select class='inp' id='cc_v'>"+activeVnds4.map(v=>"<option value='"+v.name+"'"+(v.name===modal.sol.vendedor?" selected":"")+">"+v.name+"</option>").join("")+"</select></div>"
        +"<div class='mb-act'><button class='btn-c' onclick='modal=null;render()'>Cancelar</button><button class='btn' onclick='saveConvertir()'>Crear cliente</button></div></div></div>";
    }
    else if(t==="addEsencia"){
      mHTML="<div class='mb-bg' onclick='if(event.target===this){modal=null;render()}'><div class='mb'><div class='mb-t'>Agregar esencia</div><div class='fw'><label class='lbl'>Nombre *</label><input class='inp' id='es_n' placeholder='NOMBRE DE ESENCIA' style='text-transform:uppercase' oninput='this.value=this.value.toUpperCase()'/></div><div class='fr'><div class='fw'><label class='lbl'>Stock inicial (ml)</label><input type='number' class='inp' id='es_stock' placeholder='0' min='0'/></div><div class='fw'><label class='lbl'>Minimo (ml)</label><input type='number' class='inp' id='es_min' placeholder='500' min='0' value='500'/></div></div><div class='mb-act'><button class='btn-c' onclick='modal=null;render()'>Cancelar</button><button class='btn' onclick='saveEsencia()'>Agregar</button></div></div></div>";
    }
    else if(t==="editEsencia"){
      mHTML="<div class='mb-bg' onclick='if(event.target===this){modal=null;render()}'><div class='mb'><div class='mb-t'>Editar esencia</div><div class='fw'><label class='lbl'>Nombre *</label><input class='inp' id='ees_n' value='"+modal.nombre+"' style='text-transform:uppercase' oninput='this.value=this.value.toUpperCase()'/></div><div class='mb-act'><button class='btn-c' onclick='modal=null;render()'>Cancelar</button><button class='btn' onclick='saveEditEsencia()'>Guardar</button></div></div></div>";
    }
    else if(t==="addModelo"){
      mHTML="<div class='mb-bg' onclick='if(event.target===this){modal=null;render()}'><div class='mb'><div class='mb-t'>Agregar modelo</div><div class='fw'><label class='lbl'>Nombre *</label><input class='inp' id='mod_n' placeholder='Ej: AE1000' style='text-transform:uppercase' oninput='this.value=this.value.toUpperCase()'/></div><div class='mb-act'><button class='btn-c' onclick='modal=null;render()'>Cancelar</button><button class='btn' onclick='saveModelo()'>Agregar</button></div></div></div>";
    }
  }

  // ── MAIN RENDER ──
  const navBtns=tabs.map(t2=>{
    const isCurrent=tab===t2.k;
    const badge=t2.badge?"<span style='position:absolute;top:4px;right:4px;background:var(--D);color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center'>"+t2.badge+"</span>":"";
    return"<button class='nt "+(isCurrent?"on":"")+"' onclick='tab="+JSON.stringify(t2.k)+";sq=\"\";invSq=\"\";render()' style='position:relative'><i class='ti "+t2.i+"' style='display:block'></i>"+t2.l+badge+"</button>";
  }).join("");
  const pendSolBadge=solicitudes.filter(s=>s.vendedor===sess?.name&&s.estado==="pendiente").length;
  root.innerHTML="<div class='app'>"
    +"<div class='tb'><div class='tb-logo'>E<span style='color:#b8892a'>s</span></div>"
    +"<div class='tb-r'><span class='tb-u'>"+sess.name+"</span>"
    +(isA?"<span class='ba'>Admin</span>":"")
    +(isA?"<button class='btn-o' onclick='forceSyncUp()' title='Forzar subida a nube' style='font-size:11px;padding:4px 8px'><i class='ti ti-cloud-upload'></i></button>":"")
+"<button class='btn-o' onclick='doSync()' title='Sincronizar'><i class='ti ti-refresh'></i></button>"
    +"<button class='btn-o' onclick='logout()'>Salir</button></div></div>"
    +"<div class='nav'>"+navBtns+"</div>"
    +"<div class='cnt'>"+con+"</div>"
    +"</div>"
    +mHTML
    +(toast?"<div class='toast'>"+toast+"</div>":"");
}

// ── SIMPLE VISIT (no equipment) ──
function regVisitSimple(){
  const m=document.getElementById("mmm")?.value;
  const s=selEq?.serie||document.getElementById("ec_s_tmp")?.value||"";
  const ml=parseInt(mlV)||0;
  if(!selC){showToast("Selecciona cliente");return;}
  // ml y esencia son opcionales — se puede registrar visita de mantenimiento sin descarga
  const v={id:uid(),fecha:new Date().toISOString(),vnd:sess.name,cliente:selC,modelo:m||"",serie:s||"",area:"",esencia:selS||"",ml,notas:notV||"",prob:false};
  visits=[v,...visits];sv("vis",visits);
  if(selS&&ml>0&&(inv[selS]||0)>=ml){inv={...inv,[selS]:(inv[selS]||0)-ml};sv("inv",inv);}
  selC="";selEq=null;mlV="";notV="";selS="";showToast("Visita registrada");
}

// ── INIT ──
render();
// Auto-sync every 2 min
setInterval(()=>{if(sess)syncDown().then(ok=>{if(ok)render();});},120000);
