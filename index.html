function getNextSerie(modelo){
  const allS=[];
  Object.values(EQUIPOS_DB).forEach(eqs=>eqs.forEach(eq=>{if(eq.modelo===modelo)allS.push(eq.serie);}));
  Object.values(ceq).forEach(eqs=>eqs.forEach(eq=>{if(eq.modelo===modelo&&!eq._del)allS.push(eq.serie);}));
  demos.forEach(d=>{if(d.modelo===modelo&&d.serie)allS.push(d.serie);});
  const nums=allS.map(s=>{const m=s.match(/(\d+)$/);return m?parseInt(m[1]):0;}).filter(n=>n>0);
  const next=nums.length>0?Math.max(...nums)+1:1;
  return"ES"+modelo.replace(/^AE/,"").replace(/\s.*/,"")+"-"+String(next).padStart(3,"0");
}

        <div class="fw"><label class="lbl">${tipoSol==="cliente"?"Motivo *":"Nombre del prospecto *"}</label><input class="inp" id="sol_n" placeholder="${tipoSol==="cliente"?"Revision, problema...":"Ej: Restaurante El Jardin"}"/></div>
        ${tipoSol==="cliente"?`<div class="fw"><label class="lbl">Cliente *</label><input class="inp" id="sol_ce" placeholder="Nombre del cliente" list="sol_cl"/><datalist id="sol_cl">${ALL_CLIENTS.map(c=>`<option>${c}</option>`).join("")}</datalist></div>`:""}
        <div class="fw"><label class="lbl">Vendedor *</label><select class="inp" id="sol_v"><option value="">Selecciona...</option>${activeVnds2.map(v=>`<option value="${v.name}" ${v.name===sess.name?"selected":""}>${v.name}</option>`).join("")}</select></div>
        <div class="fw"><label class="lbl">Notas</label><textarea class="inp" id="sol_notas" placeholder="Instrucciones..."></textarea></div>
        <div class="mb-act"><button class="btn-c" onclick="modal=null;render()">Cancelar</button><button class="btn" style="background:#3456a0" onclick="saveSolicitud()">Enviar</button></div>
      </div></div>`;
    }
    else if(t==="convertirCliente"){
      const sol=modal.sol;const activeVnds3=vendors.filter(v=>v.active!==false&&v.role!=="admin");
      mHTML=`<div class="mb-bg" onclick="if(event.target===this){modal=null;render()}"><div class="mb">
        <div class="mb-t">Convertir a cliente</div>
        <p class="ps" style="margin-top:-10px;margin-bottom:14px">Prospecto: <strong>${sol.nombre}</strong></p>
        <div class="fw"><label class="lbl">Nombre oficial *</label><input class="inp" id="cc_n" value="${sol.nombre.toUpperCase()}" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"/></div>
        <div class="fw"><label class="lbl">Asignar a vendedor</label><select class="inp" id="cc_v">${activeVnds3.map(v=>`<option value="${v.name}" ${v.name===sol.vendedor?"selected":""}>${v.name}</option>`).join("")}</select></div>
        <div class="mb-act"><button class="btn-c" onclick="modal=null;render()">Cancelar</button><button class="btn" onclick="saveConvertir()">Crear cliente</button></div>
      </div></div>`;
    }
    else if(t==="addCartucho"){
      mHTML=`<div class="mb-bg" onclick="if(event.target===this){modal=null;render()}"><div class="mb">
        <div class="mb-t">Agregar cartucho FMATIC</div>
        <div class="fw"><label class="lbl">Fragancia *</label><input class="inp" id="cart_n" placeholder="Ej: Coconut Paradise" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"/></div>
        <div class="mb-act"><button class="btn-c" onclick="modal=null;render()">Cancelar</button><button class="btn" onclick="addCartucho()">Agregar</button></div>
      </div></div>`;
    }
    else if(t==="reportView"){
      const rowsHTML=modal.rows.map(r=>"<tr>"+r.map(c=>"<td style='padding:6px 8px;font-size:11px'>"+(c||"")+"</td>").join("")+"</tr>").join("");
      const headersHTML=modal.headers.map(h=>"<th style='background:#1b3a2d;color:#fff;padding:7px 8px;font-size:11px;text-align:left'>"+h+"</th>").join("");
      mHTML=`<div class="mb-bg"><div class="mb" style="max-height:90vh;padding:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:16px;font-weight:700">${modal.title}</div>
          <button type="button" onclick="modal=null;render()" style="background:none;border:none;font-size:22px;cursor:pointer">✕</button>
        </div>
        <div style="overflow-x:auto;border:1px solid #eee;border-radius:8px">
          <table style="width:100%;border-collapse:collapse;min-width:600px"><thead><tr>${headersHTML}</tr></thead><tbody>${rowsHTML}</tbody></table>
        </div>
      </div></div>`;
    }

  root.innerHTML=`<div class="app">
    <div class="tb">
      <div class="tb-logo">E<span>s</span> <span style="font-size:13px;font-weight:600;letter-spacing:2px">ECOBASICS</span></div>
      <div class="tb-r">
        <span class="tb-u">${sess.name}${isA?'<span class="ba">Admin</span>':""}</span>
        <button class="btn-o" onclick="doSync()" style="margin-right:4px">⟳</button><button class="btn-o" onclick="logout()">Salir</button>
      </div>
    </div>
    <div class="nav">${tabs.map(t=>`<button class="nt ${tab===t.k?"on":""}" onclick="tab='${t.k}';sq='';render()" style="position:relative"><i class="ti ${t.i}"></i>${t.l}${t.badge?'<span style="position:absolute;top:4px;right:4px;background:var(--D);color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center">'+t.badge+'</span>':""}</button>`).join("")}</div>
    <div class="cnt">${con}</div>
  </div>
  ${mHTML}
  ${toast?`<div class="toast">${toast}</div>`:""}`;
}

render();
syncDown().then(ok=>{const cc=ld("customclients",{clients:[],vc:{}});if(cc.clients){cc.clients.forEach(c=>{if(!ALL_CLIENTS.includes(c))ALL_CLIENTS.push(c);});}if(cc.vc){Object.keys(cc.vc).forEach(v=>{if(!VC[v])VC[v]=[];cc.vc[v].forEach(c=>{if(!VC[v].includes(c))VC[v].push(c);});});}render();});
setInterval(()=>{if(!sess)return;syncDown().then(ok=>{if(ok){const cc=ld("customclients",{clients:[],vc:{}});if(cc.clients){cc.clients.forEach(c=>{if(!ALL_CLIENTS.includes(c))ALL_CLIENTS.push(c);});}if(cc.vc){Object.keys(cc.vc).forEach(v=>{if(!VC[v])VC[v]=[];cc.vc[v].forEach(c=>{if(!VC[v].includes(c))VC[v].push(c);});});}render();}});},2*60*1000);
</script>
</body>
