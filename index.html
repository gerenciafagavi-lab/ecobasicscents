function _dupSugeridos(){
  const norm=s=>s.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)/g,' ').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const stop=new Set(['SA','CV','DE','DEL','LOS','LAS','LA','EL','Y']);
  const W=s=>new Set(norm(s).split(' ').filter(w=>w.length>2&&!stop.has(w)));
  const bajasC=new Set((bajas||[]).map(b=>b.c));
  const cl=ALL_CLIENTS.filter(c=>!bajasC.has(c));
  const info=cl.map(c=>({c,w:W(c),s:new Set(getClientEqs(c).filter(e=>!e._del&&!/^S\/N/i.test(e.serie)).map(e=>e.serie)),n:getClientEqs(c).filter(e=>!e._del).length}));
  const out=[];
  for(let i=0;i<info.length;i++)for(let j=i+1;j<info.length;j++){const a=info[i],b=info[j];
    let ov=0;a.s.forEach(x=>{if(b.s.has(x))ov++;});
    let cw=0;a.w.forEach(x=>{if(b.w.has(x))cw++;});const sim=cw/Math.max(1,Math.min(a.w.size,b.w.size));
    if(ov>=1||(sim>=0.99&&cw>=1))out.push({a:a.c,b:b.c,na:a.n,nb:b.n,ov,sim});}
  return out.sort((x,y)=>y.ov-x.ov||y.sim-x.sim).slice(0,60);
}

    const pre=m[1];pats[pre]=(pats[pre]||{n:0,w:{}});pats[pre].n++;pats[pre].w[m[2].length]=(pats[pre].w[m[2].length]||0)+1;});
  const norm=p=>p.replace(/[-_ ]+$/,"").toUpperCase();
  let best=Object.entries(pats).sort((a,b)=>b[1].n-a[1].n)[0];
  let pre,pad=0;
  if(best){pre=best[0];const w=Object.entries(best[1].w).sort((a,b)=>b[1]-a[1])[0];pad=(+w[0]>1&&best[1].w[w[0]]===best[1].n)?+w[0]:0;}
  else{const code=modelo.replace(/^AE\s*/i,"").replace(/\s.*/,"");pre=/^radiant/i.test(modelo)?"ESRAD_":/^mini/i.test(modelo)?"Mini ":"ES"+code.toUpperCase()+"_";}
  const base=norm(pre);
  delModelo.forEach(s=>{const m=s.match(/^(.*?)(\d+)$/);if(m&&norm(m[1])===base&&!/^S\/N/i.test(s))maxN=Math.max(maxN,+m[2]);});
  let n=maxN+1,cand;
  do{cand=pre+String(n).padStart(pad,"0");n++;}while(usadas.has(cand.toUpperCase()));
  return cand;
}

// ── AUTH ──
function doLogin(){
  const pin=document.getElementById("lpin").value.trim();
  const role=document.getElementById("lrole").value;
  if(role==="admin"){
    if(pin===ADMIN_PIN){saveSess({role:"admin",name:"Admin"});return;}
    const av=vendors.find(x=>x.pin===pin&&x.active!==false&&x.role==="admin");
    if(av){saveSess({role:"admin",name:av.name});return;}
    document.getElementById("lerr").textContent="PIN incorrecto";return;
  }
  if(role==="atencion"){
    const ac=vendors.find(x=>x.pin===pin&&x.active!==false&&x.role==="atencion");
    if(ac){saveSess({role:"atencion",name:ac.name});return;}
    document.getElementById("lerr").textContent="PIN incorrecto";return;
  }
  const vnd=vendors.find(x=>x.pin===pin&&x.active!==false&&x.role==="vendor");
  if(vnd){saveSess({role:"vendor",name:vnd.name});return;}
  document.getElementById("lerr").textContent="PIN incorrecto";
}
function saveSess(s){
  sess=s;sv("sess",s);
  syncDown().then(ok=>{
    if(ok){const cc=ld("customclients",{clients:[],vc:{},pais:{}});if(cc.clients)cc.clients.forEach(c=>{if(!ALL_CLIENTS.includes(c))ALL_CLIENTS.push(c);});if(cc.vc)Object.keys(cc.vc).forEach(v=>{if(!VC[v])VC[v]=[];cc.vc[v].forEach(c=>{if(!VC[v].includes(c))VC[v].push(c);});});if(cc.pais)Object.assign(window._clientPais,cc.pais);}
    // Si hay pocos clientes en Supabase, subir datos base automáticamente
    if(s.role==="admin"){
      const ccNow=ld("customclients",{clients:[],vc:{},pais:{}});
      const totalC=(ccNow.clients||[]).length;
      if(totalC<BASE_CC.clients.length){
        // Fusionar BASE con lo que hay en localStorage y subir
        const merged={clients:[...BASE_CC.clients],vc:{...BASE_CC.vc},pais:{...BASE_CC.pais}};
        if(ccNow.clients)ccNow.clients.forEach(c=>{if(!merged.clients.includes(c))merged.clients.push(c);});
        if(ccNow.vc)Object.keys(ccNow.vc).forEach(v=>{if(!merged.vc[v])merged.vc[v]=[];ccNow.vc[v].forEach(c=>{if(!merged.vc[v].includes(c))merged.vc[v].push(c);});});
        if(ccNow.pais)Object.assign(merged.pais,ccNow.pais);
        sv("customclients",merged);
        const ceqNow=ld("ceq",{});
        // Convertir BASE_CEQ a formato {cliente:[{serie,...}]} antes de mergear
        const _bg={};Object.entries(BASE_CEQ).forEach(([serie,eq])=>{const c=eq.cliente;if(!c)return;if(!_bg[c])_bg[c]=[];_bg[c].push({serie,modelo:eq.modelo,area:eq.area,aroma:eq.aroma});});
        const ceqMerged={..._bg};
        // Sobreescribir con datos locales (solo arrays = formato correcto)
        Object.entries(ceqNow).forEach(([k,v])=>{if(Array.isArray(v))ceqMerged[k]=v;});
        sv("ceq",ceqMerged);
        BASE_CC.clients.forEach(c=>{if(!ALL_CLIENTS.includes(c))ALL_CLIENTS.push(c);});
        console.log("Base data synced to Supabase: "+merged.clients.length+" clients");
      }
    }
    render();
  });
}

function _asignarDirecto(c,nuevoV){

  Object.keys(VC).forEach(v=>{VC[v]=VC[v].filter(x=>x!==c);});
  if(nuevoV)VC[nuevoV]=[...(VC[nuevoV]||[]),c];
  // Actualizar customclients (persiste en Supabase)
  const cc=ld("customclients",{clients:[],vc:{},pais:{},vcOverride:{}});
  if(!cc.vc)cc.vc={};
  if(!cc.vcOverride)cc.vcOverride={};
  // Quitar de todos los vendedores en customclients
  Object.keys(cc.vc).forEach(v=>{cc.vc[v]=(cc.vc[v]||[]).filter(x=>x!==c);});
  if(nuevoV){if(!cc.vc[nuevoV])cc.vc[nuevoV]=[];if(!cc.vc[nuevoV].includes(c))cc.vc[nuevoV].push(c);}
  // Guardar override para sobreescribir BASE_CC.vc al recargar
  cc.vcOverride[c]=nuevoV;

function saveEditCEq(){
  const c=modal.c;const eq=modal.eq;
  const newSerie=document.getElementById("ec_s").value.trim();
  const newArea=document.getElementById("ec_a").value.trim();
  const newAroma=document.getElementById("ec_aroma").value;
  const newModelo=document.getElementById("ec_m")?.value||eq.modelo;
  if(!newSerie){showToast("Serie requerida");return;}
  const oldSerie=eq.serie;
  if(newSerie!==oldSerie&&getClientEqs(c).some(e=>!e._del&&e.serie===newSerie)){showToast("Esa serie ya existe en este cliente");return;}
  const existing=ceq[c]||[];
  const inCustom=existing.find(e=>(eq.id&&e.id===eq.id)||e.serie===oldSerie);
  const updated={...eq,id:eq.id||uid(),serie:newSerie,modelo:newModelo,area:newArea,aroma:newAroma,editadoPor:sess.name,editadoEn:new Date().toISOString()};
  if(inCustom){ceq={...ceq,[c]:existing.map(e=>((eq.id&&e.id===eq.id)||e.serie===oldSerie)?updated:e)};}
  else{ceq={...ceq,[c]:[...existing,updated]};}
  // Si se corrigió la serie: llevar historial, intensidad y baterías a la serie correcta
  if(newSerie!==oldSerie){
    let ch=false;visits=visits.map(v=>{if(v.cliente===c&&v.serie===oldSerie){ch=true;return{...v,serie:newSerie,modelo:newModelo};}return v;});if(ch)sv("vis",visits);
    if(eqGrades[oldSerie]&&!eqGrades[newSerie]){eqGrades={...eqGrades,[newSerie]:eqGrades[oldSerie]};delete eqGrades[oldSerie];sv("eqgrades",eqGrades);}
    let cb=false;batMovs=batMovs.map(m=>{if(m.cliente===c&&m.serie===oldSerie){cb=true;return{...m,serie:newSerie};}return m;});if(cb)sv("batMovs",batMovs);
    if(window._eqVisit&&window._eqVisit[oldSerie]){window._eqVisit[newSerie]={...window._eqVisit[oldSerie],serie:newSerie,modelo:newModelo};delete window._eqVisit[oldSerie];}
  } else if(window._eqVisit&&window._eqVisit[oldSerie]){window._eqVisit[oldSerie].modelo=newModelo;}
  const antes=[eq.modelo,oldSerie,eq.area||"",eq.aroma||""].join(" | "),despues=[newModelo,newSerie,newArea,newAroma].join(" | ");
  if(antes!==despues){eqEdits=[{id:uid(),ts:new Date().toISOString(),user:sess.name,cliente:c,antes,despues},...eqEdits].slice(0,2000);sv("eqEdits",eqEdits);}
  sv("ceq",ceq);modal=null;showToast("Equipo actualizado");
}
function puedeQuitarEq(){return sess?.role==="admin"||!!perms.vndQuitarEq;}
function _marcarEq(c,id,serie,extra,logTxt){
  const existing=ceq[c]||[];

  const inCustom=existing.find(e=>!e._del&&((id&&e.id===id)||e.serie===serie));

  ceq=inCustom?{...ceq,[c]:existing.map(e=>e===inCustom?upd:e)}:{...ceq,[c]:[...existing,upd]};
  if(window._eqVisit&&window._eqVisit[serie])delete window._eqVisit[serie];

function _inRange(iso){const f=window._rFrom||"",t=window._rTo||"";if(f&&iso<f)return false;if(t&&iso>t+"T23:59:59")return false;return true;}
function buildStats(){

  const act=ALL_CLIENTS.filter(c=>!bajasC.has(c));
  const pais=window._rPais||"todos";

  const cl=act.filter(okP);
  const S={};
  // Equipos instalados
  const porModelo={},porCliMod={},porVnd={};let totEq=0,cliConEq=0;
  cl.forEach(c=>{const eqs=getClientEqs(c).filter(e=>!e._del);if(eqs.length)cliConEq++;

    eqs.forEach(e=>{const m=e.modelo||"(sin modelo)";totEq++;porModelo[m]=(porModelo[m]||0)+1;const k=c+"|"+m;porCliMod[k]=(porCliMod[k]||0)+1;});});

    if(v.esencia&&v.ml>0&&!v.cambioAroma){mlAg+=v.ml;const k=mes+"|"+v.esencia;esMes[k]=(esMes[k]||0)+v.ml;esTot[v.esencia]=(esTot[v.esencia]||0)+v.ml;}

    cliTot[v.cliente].Visitas++;cliTot[v.cliente].ML_agregados+=(v.ml||0);if(c!=null){cliTot[v.cliente].ML_gastados+=c;mlGa+=c;}

    if(v.prob)probs.push({Fecha:v.fecha.slice(0,10),Cliente:v.cliente,Serie:v.serie||"",Modelo:v.modelo||"",Vendedor:v.vnd||"",Notas:v.notas||""});
  });
  S["Consumo por esencia"]=Object.entries(esTot).sort((a,b)=>b[1]-a[1]).map(([e,n])=>({Esencia:e,ML_agregados:n,Porcentaje:(n*100/Math.max(1,mlAg)).toFixed(1)+"%",Stock_actual:inv[e]||0}));
  S["Esencia por mes"]=Object.entries(esMes).map(([k,n])=>{const[m,e]=k.split("|");return{Mes:m,Esencia:e,ML_agregados:n};}).sort((a,b)=>a.Mes.localeCompare(b.Mes)||b.ML_agregados-a.ML_agregados);
  S["Consumo por cliente"]=Object.values(cliTot).sort((a,b)=>b.ML_agregados-a.ML_agregados);
  S["Visitas por vendedor"]=Object.values(vndMes).map(r=>{r.Visitas=r._c.size;delete r._c;return r;}).sort((a,b)=>a.Mes.localeCompare(b.Mes)||a.Vendedor.localeCompare(b.Vendedor));

  S["Rejillas por mes"]=Object.entries(rjm).map(([k,n])=>{const[m,c,r]=k.split("|");return{Mes:m,Cliente:c,Rejilla:r,Cantidad:n};}).sort((a,b)=>a.Mes.localeCompare(b.Mes)||a.Cliente.localeCompare(b.Cliente));

  // Clientes y equipos sin visita
  const hoy=Date.now();
  const lastC={},lastE={};visits.forEach(v=>{if(!lastC[v.cliente]||v.fecha>lastC[v.cliente])lastC[v.cliente]=v.fecha;const k=v.cliente+"|"+v.serie;if(!lastE[k]||v.fecha>lastE[k])lastE[k]=v.fecha;});
  const dias=f=>f?Math.floor((hoy-new Date(f).getTime())/86400000):null;

    {Indicador:"Equipos instalados",Valor:totEq},
    {Indicador:"Visitas a clientes en el período",Valor:vr},{Indicador:"Equipos atendidos en el período",Valor:vis.length},

    {Indicador:"Clientes sin visita 30+ días",Valor:S["Clientes sin visita 30+ dias"].length},
    {Indicador:"Equipos sin visita 30+ días",Valor:eqSin.length}];
  return S;
}

        +"<div class='fw'><label class='lbl'>Cantidad pedida (ml) *</label><input type='number' class='inp' id='ped_qty' placeholder='Ej: 2000' min='1' value='"+(modal.qty||"")+"' oninput='modal.qty=this.value'/></div>"
        +"<div class='fw'><label class='lbl'>Nota (opcional)</label><input class='inp' id='ped_nota' placeholder='Ej: Pedido a Air Essentials' value='"+(modal.nota||"")+"' oninput='modal.nota=this.value'/></div>"
        +"<div class='mb-act'><button class='btn-c' onclick='modal=null;render()'>Cancelar</button><button class='btn' onclick='savePedido()'>Registrar</button></div></div></div>";
    }
    else if(t==="addModelo"){
      mHTML="<div class='mb-bg' onclick='if(event.target===this){modal=null;render()}'><div class='mb'><div class='mb-t'>Agregar modelo</div><div class='fw'><label class='lbl'>Nombre *</label><input class='inp' id='mod_n' placeholder='Ej: AE1000' style='text-transform:uppercase' oninput='this.value=this.value.toUpperCase()'/></div><div class='mb-act'><button class='btn-c' onclick='modal=null;render()'>Cancelar</button><button class='btn' onclick='saveModelo()'>Agregar</button></div></div></div>";
    }
  }

  // ── MAIN RENDER ──
  const navBtns=tabs.map(t2=>{
    const isCurrent=tab===t2.k;
    const badge=t2.badge?"<span style='position:absolute;top:4px;right:4px;background:var(--D);color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center'>"+t2.badge+"</span>":"";
    return"<button class='nt "+(isCurrent?"on":"")+"' onclick='tab="+JSON.stringify(t2.k)+";sq=\"\";invSq=\"\";render()' style='position:relative'><i class='ti "+t2.i+"' style='display:block'></i>"+t2.l+badge+"</button>";
  }).join("");
  const pendSolBadge=solicitudes.filter(s=>s.vendedor===sess?.name&&s.estado==="pendiente").length;
  root.innerHTML="<div class='app'>"
    +"<div class='tb'><div class='tb-logo'>E<span style='color:#b8892a'>s</span></div>"
    +"<div class='tb-r'><span class='tb-u'>"+sess.name+"</span>"
    +(isA?"<span class='ba'>Admin</span>":"")
+"<button class='btn-o' onclick='doSync()' title='Sincronizar'><i class='ti ti-refresh'></i></button>"
    +"<button class='btn-o' onclick='logout()'>Salir</button></div></div>"
    +"<div class='nav'>"+navBtns+"</div>"
    +"<div class='cnt'>"+con+"</div>"
    +"</div>"
    +mHTML
    +(toast?"<div class='toast'>"+toast+"</div>":"");
}

// ── SIMPLE VISIT (no equipment) ──
function regVisitSimple(){
  const m=document.getElementById("mmm")?.value;
  const s=selEq?.serie||document.getElementById("ec_s_tmp")?.value||"";
  const ml=parseInt(mlV)||0;
  if(!selC){showToast("Selecciona cliente");return;}
  // ml y esencia son opcionales — se puede registrar visita de mantenimiento sin descarga
  const _f=new Date().toISOString();
  const _nr=_saveRejillas(_f);
  if(s||ml>0||!_nr){const v={id:uid(),fecha:_f,vnd:sess.name,cliente:selC,modelo:m||"",serie:s||"",area:"",esencia:selS||"",ml,notas:notV||"",prob:false};visits=[v,...visits];}
  sv("vis",visits);
  if(selS&&ml>0&&(inv[selS]||0)>=ml){inv={...inv,[selS]:(inv[selS]||0)-ml};sv("inv",inv);logInvMov(selS,-ml,"consumo","Visita: "+selC);}
  selC="";selEq=null;mlV="";notV="";selS="";showToast("Visita registrada");
}
